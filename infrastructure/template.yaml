AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  PolicyLab — Deterministic Authorization Verification, AI Explanations & Amazon Verified Permissions Deployment
  WeMakeDevs × AWS First Commit 2026 | Team VibeSync

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.11
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: !Ref EnvironmentName
        AWS_REGION: !Ref AWS::Region
        POLICYLAB_DYNAMODB_TABLE: !Ref PolicyLabTable
        POLICYLAB_ARTIFACT_BUCKET: !Ref PolicyLabArtifactsBucket
        POLICYLAB_ENTITY_TABLE: !Ref PolicyLabTable
        AVP_POLICY_STORE_ID: !Ref AVPPolicyStoreId
        AUDIT_STATE_MACHINE_ARN: !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:PolicyAuditWorkflow-${EnvironmentName}'
        AWS_BEDROCK_ENABLED: 'true'
        AWS_DYNAMODB_ENABLED: 'true'
        AWS_S3_ENABLED: 'true'
        AWS_AVP_ENABLED: 'true'

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: Deployment target environment stage.
  AVPPolicyStoreId:
    Type: String
    Default: ps-acmepay-prod
    Description: Target Amazon Verified Permissions policy store identifier.
  FrontendOrigin:
    Type: String
    Default: 'http://localhost:5173'
    Description: Allowed CORS origin for the frontend web client.

Resources:
  # ---------------------------------------------------------------------------
  # API Gateway (HTTP API v2)
  # ---------------------------------------------------------------------------
  PolicyLabHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref EnvironmentName
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Correlation-ID
        MaxAge: 300

  # ---------------------------------------------------------------------------
  # Backend Lambda Function (FastAPI + Mangum)
  # ---------------------------------------------------------------------------
  PolicyLabBackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: backend.lambda_handler.handler
      Description: Core PolicyLab deterministic Cedar engine, AI explanation, and verification backend.
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref PolicyLabHttpApi
            Path: /
            Method: ANY
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref PolicyLabHttpApi
            Path: /{proxy+}
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PolicyLabTable
        - S3CrudPolicy:
            BucketName: !Ref PolicyLabArtifactsBucket
        - Statement:
            - Sid: BedrockModelAccess
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-5-sonnet-20240620-v1:0'
                - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0'
            - Sid: VerifiedPermissionsAccess
              Effect: Allow
              Action:
                - verifiedpermissions:GetPolicyStore
                - verifiedpermissions:GetPolicy
                - verifiedpermissions:CreatePolicy
                - verifiedpermissions:UpdatePolicy
                - verifiedpermissions:IsAuthorized
                - verifiedpermissions:BatchIsAuthorized
              Resource:
                - !Sub 'arn:aws:verifiedpermissions:${AWS::Region}:${AWS::AccountId}:policy-store/${AVPPolicyStoreId}'
                - !Sub 'arn:aws:verifiedpermissions:${AWS::Region}:${AWS::AccountId}:policy-store/${AVPPolicyStoreId}/*'
    Metadata:
      BuildProperties:
        ParentPackageMode: explicit
        ParentPackages: backend

  # ---------------------------------------------------------------------------
  # DynamoDB Single-Table Storage
  # ---------------------------------------------------------------------------
  PolicyLabTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'PolicyLab-${EnvironmentName}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ---------------------------------------------------------------------------
  # S3 Artifact & Proof Storage
  # ---------------------------------------------------------------------------
  PolicyLabArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'policylab-artifacts-${AWS::AccountId}-${AWS::Region}-${EnvironmentName}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  # ---------------------------------------------------------------------------
  # Step Functions Asynchronous Audit State Machine
  # ---------------------------------------------------------------------------
  PolicyAuditStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'PolicyAuditWorkflow-${EnvironmentName}'
      DefinitionUri: ./statemachines/audit_workflow.asl.json
      DefinitionSubstitutions:
        PolicyLabBackendFunctionArn: !GetAtt PolicyLabBackendFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref PolicyLabBackendFunction

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway endpoint URL
    Value: !Sub 'https://${PolicyLabHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}'
  BackendFunctionArn:
    Description: PolicyLab Lambda Function ARN
    Value: !GetAtt PolicyLabBackendFunction.Arn
  DynamoDBTableName:
    Description: DynamoDB Table Name
    Value: !Ref PolicyLabTable
  ArtifactsBucketName:
    Description: S3 Artifacts Bucket Name
    Value: !Ref PolicyLabArtifactsBucket
  StateMachineArn:
    Description: Step Functions Audit Workflow ARN
    Value: !Ref PolicyAuditStateMachine
